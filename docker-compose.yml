# Orchestration complète : API backend + frontend nginx
# Les valeurs sensibles / spécifiques à l'environnement viennent de .env
# (voir .env.example). Ne jamais committer de vrai .env.

services:
  backend:
    build:
      context: ./backend
    image: gmq-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/gmq.db
      # Origines autorisées pour CORS (séparées par des virgules).
      # En prod, mettez l'URL publique du frontend.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Rendement carcasse par défaut (%) pour convertir carcasse -> poids vif
      RENDEMENT_DEFAULT: ${RENDEMENT_DEFAULT:-58}
      # Secret de signature des sessions (obligatoire, voir .env.example)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Email du compte qui récupère les données créées avant les comptes
      ANCIENNES_DONNEES_EMAIL: ${ANCIENNES_DONNEES_EMAIL:-}
    volumes:
      - gmq-data:/data
    # Le backend n'est pas exposé directement : seul nginx y accède
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    image: gmq-frontend
    # Nom fixe : c'est l'adresse utilisée par Caddy (reverse_proxy gmq-frontend:80).
    container_name: gmq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Lié à la loopback : en prod l'accès public passe exclusivement par Caddy
    # (stack ~/proxy) en HTTPS ; ce binding ne sert qu'au dev local. Un binding
    # 0.0.0.0 rendrait l'app joignable en HTTP nu sur IP:8080, hors TLS.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      - default   # pour joindre backend:3000
      - proxy     # joignable par le reverse-proxy Caddy
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true

volumes:
  gmq-data:
    driver: local
