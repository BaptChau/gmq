# --------------------------------------------------------------------
# Back-office : sous-domaine backof.<domaine>
# Caddy route backof.<domaine> vers ce conteneur en conservant l'en-tête Host.
# --------------------------------------------------------------------
server {
    listen 80;
    server_name ~^backof\.;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Seule l'API d'administration est joignable depuis ce sous-domaine
    location /api/admin/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # L'appli exploitant n'est pas servie ici : tout retombe sur le back-office
    location / {
        try_files /admin.html =404;
    }
}

# --------------------------------------------------------------------
# Application exploitant : domaine principal (serveur par défaut)
# --------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sécurité : en-têtes de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # L'API d'administration n'est jamais exposée sur le domaine principal
    location /api/admin/ {
        return 404;
    }

    # Proxy des appels API vers le service backend (nom du service Compose)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le back-office n'est pas servi sur le domaine principal
    location = /admin.html {
        return 404;
    }

    # Application SPA : tout le reste retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés par Vite (hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
