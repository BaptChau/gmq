# Adresse de l'application à partir de celle du site : landing.exemple.fr -> exemple.fr
# ($http_host garde le port, utile en local : landing.localhost:8080 -> localhost:8080)
map $http_host $domaine_appli {
    ~^landing\.(?<reste>.+)$ $reste;
    default $http_host;
}

# Schéma public (https derrière Caddy, qui transmet X-Forwarded-Proto)
map $http_x_forwarded_proto $schema_public {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# --------------------------------------------------------------------
# Site de présentation : sous-domaine landing.<domaine>
# Caddy route landing.<domaine> vers ce conteneur en conservant l'en-tête Host.
# --------------------------------------------------------------------
server {
    listen 80;
    server_name ~^landing\.;

    root /usr/share/nginx/html;

    # Redirections relatives : on reste en https derrière Caddy
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Boutons « Se connecter » / « Créer un compte » : vers l'application
    location = /connexion {
        return 302 $schema_public://$domaine_appli/;
    }
    location = /inscription {
        return 302 $schema_public://$domaine_appli/?inscription;
    }

    # Pas d'API sur le site de présentation
    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
    }

    # Référencement : le site est ouvert aux moteurs de recherche.
    # Les adresses sont construites à partir du domaine demandé (rien à configurer).
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n\nSitemap: $schema_public://$http_host/sitemap.xml\n";
    }
    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>$schema_public://$http_host/</loc></url>\n  <url><loc>$schema_public://$http_host/fonctionnement</loc></url>\n  <url><loc>$schema_public://$http_host/gmq</loc></url>\n</urlset>\n';
    }

    # Une seule adresse par page (évite les doublons pour Google) : /gmq.html -> /gmq
    location = /index.html {
        return 301 /;
    }
    location ~ ^/([\w-]+)\.html$ {
        return 301 /$1;
    }

    # Adresses propres : / -> landing/index.html, /gmq -> landing/gmq.html
    location = / {
        try_files /landing/index.html =404;
    }
    location / {
        try_files /landing$uri.html /landing$uri =404;
    }
}

# --------------------------------------------------------------------
# Application : domaine principal (serveur par défaut)
# --------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sécurité : en-têtes de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # L'application (pages de connexion, comptes) n'a pas à apparaître dans Google :
    # c'est le site landing.<domaine> qui est référencé.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Proxy des appels API vers le service backend (nom du service Compose)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les pages du site de présentation ne sont servies que sur landing.<domaine>
    location /landing/ {
        return 404;
    }

    # Application SPA : tout le reste retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés par Vite (hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
